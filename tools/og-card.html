<!doctype html>
<!--
  public/og.png（SNS に URL を貼ったときのサムネイル）の生成元。

  このページを 1200×630 で描画してそのまま画像にする。アプリからは読み込まれない。

  再生成:
    npm run og

  絵はアプリと同じ式で描いている。
    損益 = 数量 × 売却株価 × 売却為替 − 取得総額
  損益 ±0 は「株価 × 為替 = 一定」なので双曲線になり、中央を横切る黒い線が
  そのまま本物の損益分岐線になる。配色も view/plot.js と同じ ColorBrewer RdBu。
  文言や配色を変えたいときは、このファイルを直して再生成する。
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- 画像にする専用のページなので、幅は 1200 に固定する -->
    <meta name="viewport" content="width=1200" />
    <title>OGP カード（public/og.png の生成元）</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif;
        background: #eef0f4;
        color: #212529;
      }

      /* ---- 左：文字 ---- */
      .panel {
        flex: 0 0 540px;
        padding: 62px 56px 52px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #d3d9e0;
      }

      .eyebrow {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: #868e96;
      }

      .title {
        margin-top: 26px;
        font-size: 67px;
        font-weight: 700;
        line-height: 1.12;
        letter-spacing: -0.01em;
      }

      .rule {
        width: 74px;
        height: 4px;
        margin: 30px 0 26px;
        background: #212529;
      }

      .lede {
        font-size: 23px;
        line-height: 1.72;
        color: #495057;
      }

      /* 損益0 の線は右の図で主役。文中でも同じ扱いにする */
      .lede b {
        font-weight: 700;
        color: #212529;
      }

      .url {
        margin-top: auto;
        font-size: 19px;
        color: #868e96;
        font-variant-numeric: tabular-nums;
      }

      /* ---- 右：等高線そのもの ---- */
      .field {
        position: relative;
        flex: 1;
      }
      canvas {
        display: block;
      }

      .axis {
        position: absolute;
        font-size: 18px;
        font-weight: 600;
        color: #212529;
        background: rgb(255 255 255 / 82%);
        padding: 3px 9px;
        border-radius: 4px;
      }
      .axis-x {
        right: 22px;
        bottom: 20px;
      }
      .axis-y {
        left: 20px;
        top: 22px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <p class="eyebrow">米国株 × 為替</p>
      <h1 class="title">損益分岐<br />シミュレーター</h1>
      <div class="rule"></div>
      <p class="lede">
        買った株を、どの株価・どの為替で売れば<br /><b>損益 ±0</b>
        になるか。株価と為替の2軸で、<br />分岐点を等高線のまま読む。
      </p>
      <p class="url">us-stock-fx-simulator.vercel.app</p>
    </div>

    <div class="field">
      <canvas id="c" width="660" height="630"></canvas>
      <span class="axis axis-x">為替 →</span>
      <span class="axis axis-y">株価 ↑</span>
    </div>

    <script>
      /*
        アプリと同じ式で場を描く。
        profit = 数量 × 売却株価 × 売却為替 − 取得総額
        損益 ±0 は price × fx = 一定 なので、双曲線になる。
      */
      const QTY = 100;
      const COST = 2_175_000; // 100株 × $150 × 145円
      const FX = [120, 178];
      const PRICE = [98, 224];

      const profit = (price, fx) => QTY * price * fx - COST;

      // アプリの colorscale（ColorBrewer RdBu）と同じ停止点
      const STOPS = [
        [0.0, [178, 24, 43]],
        [0.25, [239, 138, 98]],
        [0.5, [247, 247, 247]],
        [0.75, [103, 169, 207]],
        [1.0, [33, 102, 172]],
      ];

      function sample(t) {
        t = Math.min(1, Math.max(0, t));
        for (let i = 1; i < STOPS.length; i++) {
          if (t <= STOPS[i][0]) {
            const [t0, c0] = STOPS[i - 1];
            const [t1, c1] = STOPS[i];
            const k = (t - t0) / (t1 - t0);
            return c0.map((v, j) => Math.round(v + (c1[j] - v) * k));
          }
        }
        return STOPS[STOPS.length - 1][1];
      }

      const canvas = document.getElementById("c");
      const W = canvas.width;
      const H = canvas.height;
      const ctx = canvas.getContext("2d");

      const fxAt = (x) => FX[0] + ((FX[1] - FX[0]) * x) / W;
      const priceAt = (y) => PRICE[1] - ((PRICE[1] - PRICE[0]) * y) / H;

      const extent = Math.max(Math.abs(profit(PRICE[1], FX[1])), Math.abs(profit(PRICE[0], FX[0])));
      // 色ではなく段で読ませる。アプリの等高線と同じく、切りのいい刻みで量子化する
      const STEP = 250_000;

      const image = ctx.createImageData(W, H);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const p = profit(priceAt(y + 0.5), fxAt(x + 0.5));
          const banded = Math.round(p / STEP) * STEP;
          const [r, g, b] = sample((banded / extent + 1) / 2);
          const i = (y * W + x) * 4;
          image.data[i] = r;
          image.data[i + 1] = g;
          image.data[i + 2] = b;
          image.data[i + 3] = 255;
        }
      }
      ctx.putImageData(image, 0, 0);

      // 段の境目に細い線を入れて、面ではなく等高線として読ませる
      ctx.strokeStyle = "rgba(33,37,41,.22)";
      ctx.lineWidth = 1;
      for (let level = -extent; level <= extent; level += STEP) {
        if (Math.abs(level) < 1) continue;
        ctx.beginPath();
        for (let x = 0; x <= W; x++) {
          const fx = fxAt(x);
          const price = (COST + level) / (QTY * fx);
          const y = ((PRICE[1] - price) / (PRICE[1] - PRICE[0])) * H;
          x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // 損益 ±0。この1本がこの道具の存在理由なので、ここだけ太く黒で引く
      ctx.strokeStyle = "#212529";
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let x = 0; x <= W; x++) {
        const price = COST / (QTY * fxAt(x));
        const y = ((PRICE[1] - price) / (PRICE[1] - PRICE[0])) * H;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();

      // 線の上にラベルを置く
      const labelFx = 150;
      const labelX = ((labelFx - FX[0]) / (FX[1] - FX[0])) * W;
      const labelPrice = COST / (QTY * labelFx);
      const labelY = ((PRICE[1] - labelPrice) / (PRICE[1] - PRICE[0])) * H;

      ctx.font = '700 25px "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif';
      const text = "損益 ±0";
      const w = ctx.measureText(text).width;
      const padX = 14;
      const padY = 10;
      const boxW = w + padX * 2;
      const boxH = 25 + padY * 2;
      const boxX = labelX - boxW / 2;
      const boxY = labelY - boxH - 16;

      ctx.fillStyle = "#212529";
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 6);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";
      ctx.fillText(text, labelX, boxY + boxH / 2 + 1);

      // ラベルから線へ引き出す
      ctx.strokeStyle = "#212529";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(labelX, boxY + boxH);
      ctx.lineTo(labelX, labelY - 2);
      ctx.stroke();

      /*
        現在地の輪はここには置かない。凡例の無い1枚絵では
        「説明されない点」が1つ増えるだけで、±0 の線から目を逸らす。
      */

      document.documentElement.dataset.ready = "1";
    </script>
  </body>
</html>
